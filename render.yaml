services:
  - type: web
    name: jbsmart
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn jbsmart.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
